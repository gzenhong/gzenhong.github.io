<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="歡迎來到我的個人網站，探索我的作品集與創作旅程。" />
  <title>我的個人網站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #1a2d6e;
      --blue:       #2563eb;
      --sky:        #4a90d9;
      --light-blue: #dbeafe;
      --pale:       #f0f6ff;
      --white:      #ffffff;
      --text-dark:  #0f1a3e;
      --text-muted: #4b6087;
      --radius:     12px;
      --shadow:     0 8px 32px rgba(26,45,110,.12);
      --transition: 0.3s cubic-bezier(.4,0,.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background: var(--white);
      color: var(--text-dark);
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ── Navigation ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(37,99,235,.12);
      box-shadow: 0 2px 16px rgba(26,45,110,.08);
    }

    nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo .logo-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--sky));
      box-shadow: 0 0 8px rgba(37,99,235,.5);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.25); opacity: .7; }
    }

    .nav-links {
      display: flex;
      gap: 0.25rem;
      list-style: none;
    }

    .nav-links a {
      display: block;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color var(--transition), background var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--blue);
      background: var(--light-blue);
    }

    .nav-links a.active {
      font-weight: 700;
    }

    /* ── Hero / Banner ── */
    .hero {
      position: relative;
      max-width: 1100px;
      margin: 2.5rem auto 0;
      padding: 0 1.5rem;
    }

    .banner-wrap {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(26,45,110,.18);
    }

    .banner-wrap img {
      display: block;
      width: 100%;
      height: 340px;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .banner-wrap:hover img {
      transform: scale(1.03);
    }

    /* gradient overlay */
    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(26,45,110,.72) 0%,
        rgba(37,99,235,.45) 55%,
        transparent 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2.5rem 3rem;
    }

    .banner-tag {
      display: inline-block;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      border-radius: 99px;
      margin-bottom: 1rem;
      width: fit-content;
      animation: fadeUp .8s ease both;
    }

    .banner-heading {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      text-shadow: 0 2px 12px rgba(0,0,0,.3);
      animation: fadeUp .8s .15s ease both;
    }

    .banner-sub {
      margin-top: .75rem;
      font-size: 1.05rem;
      color: rgba(255,255,255,.85);
      max-width: 480px;
      animation: fadeUp .8s .28s ease both;
    }

    .banner-btn {
      margin-top: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--white);
      color: var(--navy);
      font-weight: 700;
      font-size: 0.92rem;
      padding: 0.65rem 1.5rem;
      border-radius: 99px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      transition: transform var(--transition), box-shadow var(--transition);
      animation: fadeUp .8s .4s ease both;
      width: fit-content;
    }

    .banner-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }

    .banner-btn .arrow { transition: transform var(--transition); }
    .banner-btn:hover .arrow { transform: translateX(4px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Welcome Section ── */
    .welcome {
      max-width: 1100px;
      margin: 3.5rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }

    .welcome-text h2 {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.3;
      margin-bottom: 1rem;
    }

    .welcome-text h2 span {
      background: linear-gradient(90deg, var(--blue), var(--sky));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-text p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 0.85rem;
    }

    .welcome-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .stat-card {
      background: var(--pale);
      border: 1px solid rgba(37,99,235,.1);
      border-radius: var(--radius);
      padding: 1.2rem 1.4rem;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .stat-card .num {
      font-size: 2rem;
      font-weight: 700;
      color: var(--blue);
      line-height: 1;
    }

    .stat-card .label {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      font-weight: 500;
    }

    /* ── Divider ── */
    .divider {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--light-blue), transparent);
    }

    /* ── Footer ── */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,.6);
      text-align: center;
      padding: 2rem 1.5rem;
      font-size: 0.85rem;
      margin-top: 4rem;
    }

    footer a {
      color: var(--sky);
      text-decoration: none;
    }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .welcome {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .banner-wrap img { height: 240px; }
      .banner-overlay  { padding: 1.5rem; }
    }

    @media (max-width: 480px) {
      .nav-links a { padding: 0.4rem 0.65rem; font-size: 0.88rem; }
    }
  </style>
</head>
<body>

  <!-- ═══ Header / Nav ═══ -->
  <header>
    <nav>
      <a href="#" class="logo" id="logo-link">
        <span class="logo-dot"></span>
        我的個人網站
      </a>
      <ul class="nav-links" role="list">
        <li><a href="#" class="active" id="nav-home">首頁</a></li>
        <li><a href="about.html" id="nav-about">關於我</a></li>
        <li><a href="portfolio.html" id="nav-portfolio">作品集</a></li>
      </ul>
    </nav>
  </header>

  <!-- ═══ Hero Banner ═══ -->
  <main>
    <section class="hero" aria-label="網站橫幅">
      <div class="banner-wrap">
        <img
          src="banner.png"
          alt="藍白抽象幾何橫幅背景"
          width="1100"
          height="340"
        />
        <div class="banner-overlay">
          <span class="banner-tag">✦ 歡迎來到我的世界</span>
          <h1 class="banner-heading">
            創意・設計・<br>無限可能
          </h1>
          <p class="banner-sub">
            在這裡，你將看到我的思考、設計與作品。<br>
            讓我們一起在數位世界留下有意義的足跡。
          </p>
          <a href="portfolio.html" class="banner-btn" id="hero-cta">
            探索作品集 <span class="arrow">→</span>
          </a>
        </div>
      </div>
    </section>

    <!-- ═══ Welcome Section ═══ -->
    <section class="welcome" aria-labelledby="welcome-heading">
      <div class="welcome-text">
        <h2 id="welcome-heading">
          你好，很高興<br>
          <span>與你相遇</span> 👋
        </h2>
        <p>
          我是一位對設計與技術充滿熱情的創作者，
          致力於打造兼具美感與功能性的數位體驗。
        </p>
        <p>
          無論是網頁設計、視覺創作還是程式開發，
          我都抱持著持續學習與精益求精的態度前行。
          歡迎深入了解我的作品與故事。
        </p>
      </div>

      <div class="welcome-stats" aria-label="個人亮點統計">
        <div class="stat-card">
          <div class="num">10+</div>
          <div class="label">完成專案</div>
        </div>
        <div class="stat-card">
          <div class="num">3+</div>
          <div class="label">年設計經驗</div>
        </div>
        <div class="stat-card">
          <div class="num">∞</div>
          <div class="label">學習熱情</div>
        </div>
        <div class="stat-card">
          <div class="num">100%</div>
          <div class="label">用心投入</div>
        </div>
      </div>
    </section>

    <hr class="divider" />
  </main>

  <!-- ═══ Footer ═══ -->
  <footer>
    <p>© 2026 我的個人網站 · 以 ❤️ 用心打造</p>
  </footer>

</body>
</html>
